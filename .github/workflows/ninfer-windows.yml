name: NInfer Windows build

# Compiles and packages the patched NInfer backend for Windows x64 with CUDA, the way NInfer's own
# native release does: object shards fill a compiler cache, then one job links and packages from it.
# The runners have no GPU, so this proves the build and produces the release archive; it does not
# run inference or the GPU tests.

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: CUDA Toolkit version
        default: '13.4.3'
      archs:
        description: CMAKE_CUDA_ARCHITECTURES (default 120a, RTX 50 series; also 70, 75, 80, 86, 89)
        default: '120a'
  push:
    paths:
      - backends/versions.json
      - backends/patches/ninfer-*.patch
      - .github/workflows/ninfer-windows.yml
      - .github/actions/ninfer-windows-setup/**

permissions:
  contents: read

concurrency:
  group: ninfer-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: ${{ inputs.cuda || '13.4.3' }}
  CUDA_ARCHS: ${{ inputs.archs || '120a' }}
  # CUDA 13 installer packages, as in NInfer's native release (CUDA 12 has no crt/nvvm entries).
  CUDA_PACKAGES: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump", "nvprune"]'
  SHARDS: 4
  CCACHE_DIR: ${{ github.workspace }}/.cache/ninfer-objects
  CCACHE_MAXSIZE: 8Gi
  CCACHE_COMPILERCHECK: content
  CCACHE_DEPEND: 'true'
  CCACHE_COMPRESSLEVEL: '5'

jobs:
  # Builds FFmpeg and curl once per vcpkg baseline, so the shards restore them instead.
  dependencies:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/ninfer-windows-setup
        with:
          cuda: ${{ env.CUDA_VERSION }}
          archs: ${{ env.CUDA_ARCHS }}
          packages: ${{ env.CUDA_PACKAGES }}
      - if: steps.setup.outputs.vcpkg-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.setup.outputs.vcpkg-key }}
      - name: Preserve configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-configure-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            backends/ninfer/build-release/CMakeFiles/CMakeConfigureLog.yaml
            backends/ninfer/build-release/vcpkg-manifest-install.log
            .vcpkg/buildtrees/**/*.log

  objects:
    needs: dependencies
    runs-on: windows-2022
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninfer-windows-setup
        with:
          cuda: ${{ env.CUDA_VERSION }}
          archs: ${{ env.CUDA_ARCHS }}
          packages: ${{ env.CUDA_PACKAGES }}
      - name: Compile object shard ${{ matrix.shard }}
        working-directory: backends/ninfer
        run: |
          ccache --zero-stats
          python .github/scripts/build-object-shard.py --build build-release --shard ${{ matrix.shard }} --count $env:SHARDS --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Object shard compilation failed' }
          ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-objects-${{ matrix.shard }}
          path: .cache/ninfer-objects
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  package:
    needs: objects
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ninfer-windows-setup
        with:
          cuda: ${{ env.CUDA_VERSION }}
          archs: ${{ env.CUDA_ARCHS }}
          packages: ${{ env.CUDA_PACKAGES }}
      - name: Restore every object shard
        uses: actions/download-artifact@v4
        with:
          pattern: ninfer-objects-*
          path: .cache/ninfer-objects
          merge-multiple: true
      - name: Link release products
        working-directory: backends/ninfer
        run: |
          ccache --zero-stats
          cmake --build build-release -j 2 --target ninfer ninfer-serve ninfer_bench ninfer-calibrate ninfer-perplexity ninfer-ngram-profile
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          ccache --show-stats
      - name: Package, verify device images and test startup without the Toolkit on PATH
        working-directory: backends/ninfer
        run: |
          python .github/scripts/fetch-cuda-license.py --version $env:CUDA_VERSION --output "$env:CUDA_PATH/EULA.txt"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA licence extraction failed' }
          # package-release.ps1 refuses a modified tree in CI. Record the prepared kvmem patch series
          # as a local commit, so the archive names that tree instead of the bare upstream revision.
          git add -A
          git -c user.name=kvmem-ci -c user.email=kvmem-ci@localhost commit -q -m "kvmem patch series $(git write-tree)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record the prepared source' }
          $env:NINFER_BUILD_ROOT = "$pwd/build-release"
          pwsh -NoProfile -File scripts/package-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-cuda${{ env.CUDA_VERSION }}
          path: |
            backends/ninfer/dist/*.7z*
            backends/ninfer/dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
