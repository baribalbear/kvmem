name: Upstream sync

# Merges kvmem/kvmem master into this fork's master on the sync/upstream branch and opens (or
# updates) a pull request into master. The merge is checked first: every backend patch series must
# apply and reproduce its recorded trees, which is what an upstream NInfer change breaks for the
# fork's EXL3 patch (see docs/upstream-sync.md). When upstream only adds or regenerates NInfer
# patches, scripts/rebase-ninfer-exl3.py re-appends the EXL3 patch with a three-way apply and the
# merge goes ahead. A failed run means the pull request needs work.
#
# GITHUB_TOKEN cannot push commits that change .github/workflows, and pull requests it opens do not
# start other workflows. A SYNC_TOKEN secret (fine-grained, this repository: Contents, Pull requests
# and Workflows read/write) lifts both limits; without it, a sync that touches workflows fails to push.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/kvmem/kvmem.git
  BRANCH: sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge upstream master
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "$UPSTREAM" master
          upstream=$(git rev-parse FETCH_HEAD)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "master already contains kvmem/kvmem ${upstream:0:7}"
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline "HEAD..$upstream" > upstream-commits.txt
          git checkout -B "$BRANCH"
          previous=$(git rev-parse HEAD)
          # Re-append the EXL3 patch to upstream's NInfer series (scripts/rebase-ninfer-exl3.py).
          rebase_exl3() {
            python scripts/rebase-ninfer-exl3.py --previous "$previous" > exl3.log 2>&1 || {
              cat exl3.log; return 1; }
            cat exl3.log
            git add backends/versions.json backends/patches/ninfer-exl3.patch \
              scripts/model_health_ninfer/PROVENANCE.json
          }
          if git merge --no-ff --no-edit -m "Merge kvmem/kvmem master (${upstream:0:7})" "$upstream"; then
            # A clean merge can still leave the EXL3 entry behind a changed upstream series.
            if ! git diff --quiet "$previous" HEAD -- backends/versions.json; then
              if rebase_exl3; then
                git diff --cached --quiet || git commit --amend --no-edit
                echo "exl3=rebased" >> "$GITHUB_OUTPUT"
              else
                echo "exl3=failed" >> "$GITHUB_OUTPUT"
              fi
            fi
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            # Upstream adding or regenerating NInfer patches conflicts only in versions.json.
            if [ "$(cat conflicts.txt)" = backends/versions.json ] &&
               git checkout --theirs backends/versions.json && rebase_exl3; then
              git commit --no-edit
              echo "exl3=rebased" >> "$GITHUB_OUTPUT"
              echo "state=merged" >> "$GITHUB_OUTPUT"
            else
              [ -s exl3.log ] && echo "exl3=failed" >> "$GITHUB_OUTPUT"
              git merge --abort
              # Offer upstream itself; the pull request then shows the conflicts to resolve.
              git checkout -B "$BRANCH" "$upstream"
              echo "state=conflict" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check the backend patch series and tests
        id: check
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python scripts/prepare-backends.py &&
            python scripts/prepare-backends.py --check &&
            python tests/test_prune_ninfer_vocab.py &&
            python tests/test_model_health.py &&
            python tests/test_ci_changes.py
          } 2>&1 | tee check.log
      - name: Require SYNC_TOKEN for upstream workflow changes
        if: steps.merge.outputs.state != 'current'
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          changed=$(git diff --name-only origin/master HEAD -- .github/workflows)
          if [ "$HAS_SYNC_TOKEN" != true ] && [ -n "$changed" ]; then
            {
              echo "### Upstream sync blocked: SYNC_TOKEN is missing"
              echo
              echo "Upstream changed these workflows, which GITHUB_TOKEN cannot push:"
              echo; echo "$changed" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Add a fine-grained token for this repository (Contents, Pull requests and Workflows:"
              echo "read and write) as the SYNC_TOKEN Actions secret, then rerun. See docs/upstream-sync.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream changed .github/workflows; add the SYNC_TOKEN secret (see the run summary)."
            exit 1
          fi
      - name: Push the branch and open the pull request
        if: steps.merge.outputs.state != 'current'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          STATE: ${{ steps.merge.outputs.state }}
          EXL3: ${{ steps.merge.outputs.exl3 }}
          CHECK: ${{ steps.check.outcome }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Merges [kvmem/kvmem master](https://github.com/kvmem/kvmem/commit/$UPSTREAM_SHA) (\`${UPSTREAM_SHA:0:7}\`) into master."
            echo
            if [ "$EXL3" = failed ]; then
              echo "**The EXL3 patch could not be re-appended automatically:**"
              echo; echo '```'; tail -n 40 exl3.log; echo '```'; echo
            elif [ "$EXL3" = rebased ]; then
              echo "Upstream's NInfer series changed; the EXL3 patch was re-appended automatically: $(tail -n 1 exl3.log)"
              echo
            fi
            if [ "$STATE" = conflict ]; then
              echo "**The merge conflicts.** This branch is upstream itself; resolve these files against master:"
              echo; sed 's/^/- `/; s/$/`/' conflicts.txt
              echo
              echo "If \`backends/versions.json\` or a NInfer patch conflicts, regenerate the EXL3 patch as described in docs/upstream-sync.md."
            elif [ "$CHECK" = success ]; then
              echo "The merge is clean. Every backend patch series applies and reproduces its recorded trees, and the Python tests pass."
            else
              echo "**The merge is clean, but the checks failed.** Usually an upstream NInfer change means the EXL3 patch must be regenerated; see docs/upstream-sync.md."
              echo; echo '```'; tail -n 40 check.log; echo '```'
            fi
            echo
            echo "Upstream commits:"; echo; sed 's/^/- /' upstream-commits.txt | head -n 50
            echo; echo "[Sync run]($RUN_URL)"
          } > body.md
          title="Sync with kvmem/kvmem (${UPSTREAM_SHA:0:7})"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file body.md
          else
            gh pr create --base master --head "$BRANCH" --title "$title" --body-file body.md
          fi
      - name: Fail when the sync needs attention
        if: steps.merge.outputs.state == 'conflict' || steps.check.outcome == 'failure'
        run: |
          echo "::error::The upstream sync needs manual work; see the pull request."
          exit 1
